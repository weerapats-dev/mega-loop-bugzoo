[project]
name = "bugzoo"
version = "0.1.0"
description = "Synthetic traces that trip every MEGA Loop detector, for dashboards and docs"
requires-python = ">=3.11"
dependencies = [
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bugzoo"]
